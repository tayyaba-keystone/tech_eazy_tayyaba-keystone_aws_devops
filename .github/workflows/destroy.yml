name: Destroy AWS Infra

on:
  push:
    tags:
      - 'destroy-dev'
      - 'destroy-prod'

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2

    - name: Terraform Init
      run: terraform init

    - name: Determine Stage
      id: stage
      run: |
        TAG_NAME=${GITHUB_REF#refs/tags/}
        if [[ "$TAG_NAME" == "destroy-prod" ]]; then
          echo "stage=prod" >> "$GITHUB_OUTPUT"
        else
          echo "stage=dev" >> "$GITHUB_OUTPUT"
        fi

     # ✅ Backend switch logic — this is where you add it
    - name: Select backend based on stage
      run: |
        if [[ "${{ steps.stage.outputs.stage }}" == "prod" ]]; then
          cp backend-prod.tf backend.tf
        else
          cp backend-dev.tf backend.tf
        fi

    - name: Terraform Destroy (${{ steps.stage.outputs.stage }})
      id: destroy_step
      run: |
        echo "Destroying stage: ${{ steps.stage.outputs.stage }}"
        terraform destroy -auto-approve \
          -var="stage=${{ steps.stage.outputs.stage }}" \
          -var="bucket_name=tayyaba-devops-app-logs-techeazy" \
          -var="github_token=${{ secrets.GH_PAT }}" \
        | tee destroy-output.log

    - name: Upload Destroy Log to S3 if Failed
      if: failure()
      run: |
        TIMESTAMP=$(date +%Y-%m-%d-%H-%M-%S)
        STAGE=${{ steps.stage.outputs.stage }}
        FILE="tf-destroy-failed-${STAGE}-${TIMESTAMP}.log"
        aws s3 cp destroy-output.log s3://tayyaba-devops-app-logs-techeazy/logs/$FILE
